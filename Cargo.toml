[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.85"
authors      = ["Bao Ninh <bao.ninh@orochi.network>"]
repository   = "https://github.com/orochi-network/KPIR-index"
license      = "MIT OR Apache-2.0"

[workspace.dependencies]
simplepir   = { path = "crates/simplepir",  version = "0.1" }
kpir-index  = { path = "crates/kpir-index",  version = "0.1" }
clap        = { version = "4", features = ["derive"] }
criterion   = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
rand        = "0.9"
rand_chacha = "0.9"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
proptest    = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# `missing_docs` is opt-in per crate (see each `lib.rs`), to avoid warning on
# tests, benches, and examples during scaffolding.

[workspace.lints.clippy]
todo      = "warn"
dbg_macro = "warn"
# `unwrap_used`/`expect_used`/`panic` are left at default: they are idiomatic in
# the benches/tests where a violated invariant should abort.

[profile.release]
lto           = "fat"
codegen-units = 1
debug         = false

[profile.bench]
inherits = "release"
debug    = true
